name: Release

# Publishes the GitHub Release HACS needs (a tag alone is not enough).
# Run it from Actions → Release → Run workflow on main, after the version bump
# and release-notes/v<version>.md are merged. See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 1.9.0 or 1.10.0-beta.1 (must match manifest.json)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check the version, manifest and release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.9.0 or 1.10.0-beta.1"
            exit 1
          fi
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/openclaw/manifest.json'))['version'])")
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::manifest.json says $manifest, not $VERSION"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          notes="release-notes/v$VERSION.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing"
            exit 1
          fi
          if ! head -n 1 "$notes" | grep -q "^# v$VERSION"; then
            echo "::error::The first line of $notes must be the title, starting '# v$VERSION'"
            exit 1
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run tests
        run: pytest

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          notes="release-notes/v$VERSION.md"
          title=$(head -n 1 "$notes" | sed 's/^# //')
          tail -n +2 "$notes" > "$RUNNER_TEMP/notes.md"
          flags=()
          # HACS treats pre-releases as betas: only versions with a suffix
          # (1.10.0-beta.1) are marked as one, never a stable release.
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"
          gh release view "v$VERSION"
